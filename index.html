<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1533">
  <meta name="robots" content="noindex,nofollow">
  <title>A private page for Kavya</title>
  <style>
    :root { color-scheme: dark; --navy: #080f2b; --silver: #dbe6f2; --blue: #91afd2; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    body {
      min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center;
      color: #f8f9fc; font-family: "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 10%, #1a3266, #0b1638 48%, #070d24);
    }
    .gate {
      width: min(440px, 100%); padding: clamp(30px, 8vw, 52px); text-align: center;
      border: 1px solid #dbe6f244; border-radius: 24px;
      background: #0b1533d9; box-shadow: 0 26px 90px #0007;
      backdrop-filter: blur(14px);
    }
    .moon { margin: 0 auto 24px; width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 38% 36%, #fff 0 8%, #dce7f7 38%, #87a9d1 72%); box-shadow: 0 0 35px #b1cff466; }
    .eyebrow { margin: 0 0 10px; color: var(--blue); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font: 400 clamp(38px, 9vw, 52px)/1 "Georgia", serif; }
    .message { margin: 16px 0 25px; color: var(--silver); font: 20px/1.5 Georgia, serif; }
    label { display: block; margin-bottom: 8px; text-align: left; color: #d7e0ef; font-size: 12px; }
    input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #dbe6f255; border-radius: 10px; outline: 0; color: #f8f9fc; background: #080f2b; font: 16px "Segoe UI", sans-serif; user-select: text; }
    input:focus { border-color: var(--silver); box-shadow: 0 0 0 3px #dbe6f222; }
    button { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 999px; color: var(--navy); background: var(--silver); font: 700 13px "Segoe UI", sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 22px; margin: 14px 0 0; color: #c5d3e6; font-size: 12px; }
    .sparkles { margin-top: 24px; color: var(--blue); letter-spacing: .3em; }
    @media (prefers-reduced-motion: no-preference) {
      .moon { animation: moonGlow 3s ease-in-out infinite alternate; }
      @keyframes moonGlow { to { box-shadow: 0 0 55px #b1cff488; transform: scale(1.04); } }
    }
  </style>
</head>
<body>
  <main class="gate">
    <div class="moon" aria-hidden="true"></div>
    <p class="eyebrow">A little universe, made for</p>
    <h1>Kavya</h1>
    <p class="message">This page is just for you.<br>Enter our secret to come in.</p>
    <form id="unlockForm">
      <label for="password">Our password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="unlockButton" type="submit">Unlock my little universe ♡</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="sparkles" aria-hidden="true">✦ &nbsp; · &nbsp; ✦</div>
  </main>
  <script>
    "use strict";

    const form = document.getElementById("unlockForm");
    const passwordInput = document.getElementById("password");
    const unlockButton = document.getElementById("unlockButton");
    const status = document.getElementById("status");
    const utf8 = new TextEncoder();

    function fromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password, salt) {
      const material = await crypto.subtle.importKey(
        "raw", utf8.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    function fileKeyFromUrl(value, rootPath) {
      if (!value || value.startsWith("#") || /^(data:|blob:|javascript:|mailto:|tel:)/i.test(value)) return null;
      let url;
      try { url = new URL(value, location.href); } catch { return null; }
      if (url.origin !== location.origin || !url.pathname.startsWith(rootPath)) return null;
      try { return decodeURIComponent(url.pathname.slice(rootPath.length)); } catch { return null; }
    }

    async function unlock(password) {
      const response = await fetch(new URL("./site.enc", location.href), { cache: "no-store" });
      if (!response.ok) throw new Error("Missing encrypted package. Upload site.enc beside index.html and redeploy.");

      const bundle = new Uint8Array(await response.arrayBuffer());
      if (bundle.length < 48 || bundle[0] !== 75 || bundle[1] !== 65 || bundle[2] !== 86 || bundle[3] !== 49) {
        throw new Error("Encrypted package is missing or damaged.");
      }

      const salt = bundle.slice(4, 20);
      const iv = bundle.slice(20, 32);
      const ciphertext = bundle.slice(32);
      const key = await deriveKey(password, salt);
      const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      const payload = JSON.parse(new TextDecoder().decode(plaintext));
      if (payload.version !== 1 || !payload.files || !payload.files["index.html"]) {
        throw new Error("Encrypted package has an unexpected format.");
      }

      const objectUrls = new Map();
      for (const [name, file] of Object.entries(payload.files)) {
        const blob = new Blob([fromBase64(file.data)], { type: file.type || "application/octet-stream" });
        objectUrls.set(name, URL.createObjectURL(blob));
      }

      const rootPath = new URL("./", location.href).pathname;
      const parser = new DOMParser();
      const siteDocument = parser.parseFromString(
        new TextDecoder().decode(fromBase64(payload.files["index.html"].data)),
        "text/html"
      );
      for (const element of siteDocument.querySelectorAll("[src], [href]")) {
        for (const attribute of ["src", "href"]) {
          if (!element.hasAttribute(attribute)) continue;
          const keyName = fileKeyFromUrl(element.getAttribute(attribute), rootPath);
          if (keyName && objectUrls.has(keyName)) element.setAttribute(attribute, objectUrls.get(keyName));
        }
      }

      const scripts = Array.from(siteDocument.querySelectorAll("script[src]")).map((script) => script.getAttribute("src"));
      for (const script of siteDocument.querySelectorAll("script[src]")) script.remove();
      document.open();
      document.write(`<!doctype html>\n${siteDocument.documentElement.outerHTML}`);
      document.close();
      for (const source of scripts) {
        const script = document.createElement("script");
        script.src = source;
        document.body.appendChild(script);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!crypto.subtle) {
        status.textContent = "Secure decryption is unavailable. Open this site in a current browser over HTTPS.";
        return;
      }

      unlockButton.disabled = true;
      passwordInput.disabled = true;
      status.textContent = "Unlocking your page…";
      try {
        await unlock(passwordInput.value);
      } catch (error) {
        console.error("Could not unlock the protected site.", error);
        status.textContent = error.message && error.message.startsWith("Missing encrypted package")
          ? error.message
          : "That password didn’t unlock the page. Please check it and try again.";
        passwordInput.value = "";
        passwordInput.disabled = false;
        passwordInput.focus();
        unlockButton.disabled = false;
      }
    });
  </script>
</body>
</html>
